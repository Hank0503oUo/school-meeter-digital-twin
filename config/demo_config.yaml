# ── NTU Campus Energy Digital Twin DEMO ── 設定檔
# 所有路徑相對於 demo/ 根目錄

# ── 資料路徑 ────────────────────────────────────────────────
paths:
  # Step 1 輸出: OSM 建物足跡 GeoJSON
  osm_geojson: data/ntu_buildings.geojson

  # Step 2 輸入: 電表 V12 結果摘要
  per_building_summary: ../idf_r2_optimizer/results_v12_building/per_building_summary.csv

  # Step 2 輸出: 電表↔建物對應表
  meter_building_map: data/meter_building_map.csv

  # Step 4 輸出: 合併後能耗 GeoJSON
  energy_geojson: data/ntu_energy.geojson

  # 匯出 HTML 地圖
  export_html: data/campus_map.html

# ── 台大校園 Bounding Box ──────────────────────────────────
# 涵蓋校總區 + 水源校區
bbox:
  south: 25.0130
  west:  121.5290
  north: 25.0250
  east:  121.5470

# ── 地圖初始視角 ───────────────────────────────────────────
map:
  center_lon: 121.5375
  center_lat: 25.0175
  zoom: 16
  pitch: 50          # 俯瞰角度 (0 = 正上方, 60 = 斜視)
  bearing: -15       # 旋轉角

# ── 反事實引擎參數 ──────────────────────────────────────────
counterfactual:
  # 台灣電力碳排放係數 (kg CO₂ / kWh, 2023 台電公佈)
  grid_emission_factor: 0.494
  # 非營業用平均電價 (NT$ / kWh)
  electricity_price_ntd: 2.5
  # 每棵樹年吸碳量 (kg CO₂ / 棵·year)
  tree_annual_absorption: 21.0

  # 敏感度係數
  sensitivity:
    cooling_pct_per_degC: -0.030   # +1°C → −3% cooling
    lighting_fraction: 0.15         # 照明佔比
    occupancy_fraction: 0.08        # 佔用影響佔比
    equipment_fraction: 0.35        # 設備佔比
    cooling_portion: 0.40           # 冷卻佔總能耗比

# ── Dashboard 控制元件範圍 ──────────────────────────────────
dashboard:
  port: 5006
  title: "NTU 校園能源數位分身"

  sliders:
    cooling_delta:
      label: "冷卻溫控偏移 (°C)"
      start: -2.0
      end: 4.0
      step: 0.5
      value: 0.0

    lighting_ratio:
      label: "照明密度比例"
      start: 0.5
      end: 1.2
      step: 0.05
      value: 1.0

    occupancy_ratio:
      label: "人員佔用率比例"
      start: 0.3
      end: 1.2
      step: 0.05
      value: 1.0

    equipment_ratio:
      label: "設備功率比例"
      start: 0.5
      end: 1.2
      step: 0.05
      value: 1.0

  # 年份區間
  year_range:
    start: 2014
    end: 2020
    default: 2020

# ── 色彩比例尺 ─────────────────────────────────────────────
color_scales:
  # 能耗 choropleth: mean_kw → hex color（柔和版）
  energy:
    - [0,    "#5e9e82"]   # 低 → 柔綠
    - [200,  "#8bb86a"]   # 中低 → 草綠
    - [500,  "#ccb147"]   # 中 → 暖金
    - [1000, "#c17a50"]   # 高 → 赤陶
    - [2000, "#9e5578"]   # 極高 → 玫粉

  # R² 模型品質: best_r2_oof → hex color
  r2:
    - [-0.5, "#c17a50"]  # 差 → 赤陶
    - [0.3,  "#ccb147"]  # 普通 → 暖金
    - [0.6,  "#8bb86a"]  # 中 → 草綠
    - [0.8,  "#5e9e82"]  # 良 → 柔綠
    - [0.95, "#4eb88a"]  # 優 → 翡翠

# Trust policy for demo "credible mode" behavior.
trust_policy:
  hide_absolute_roles:
    - shared_total
    - unknown
    - feeder
    - campus_total
    - backup

  coverage:
    hide_absolute_below: 0.50
    low_flag_below: 0.50
    mid_flag_below: 0.70
    confidence_medium_min: 0.50
    confidence_high_min: 0.80

  confidence:
    high_score_min: 90.0
    medium_score_min: 70.0
    high_roles: [building_total, submeter]
    medium_roles: [building_total, submeter, shared_total]

  physics:
    night_to_day_high_default: 1.20
    peak_ratio_high: 8.00
    peak_ratio_flat: 1.05
    low_eui_kw_threshold:
      eui_below: 5.0
      kw_above: 50.0

  r2_definition_gap_flag: 0.25

  eui_caps_by_role:
    building_total: 1200.0
    submeter: 1400.0
    shared_total: 700.0
    unknown: 550.0
    feeder: 450.0
    campus_total: 350.0
    virtual: 400.0

  relative_eui_ref_by_role:
    building_total: 220.0
    submeter: 260.0
    shared_total: 180.0
    unknown: 150.0
    feeder: 120.0
    campus_total: 100.0
    virtual: 180.0

# Manual profile rules for selected building types.
manual_profiles:
  hospital:
    enabled: true
    name_keywords: ["醫院", "癌醫", "Hospital", "NTUH", "Children and Women"]
    relax_night_to_day_high_to: 1.80
    eui_cap_override_by_role:
      building_total: 1800.0
      shared_total: 1200.0
      unknown: 1000.0
      feeder: 900.0
      virtual: 900.0
    relative_eui_ref: 420.0

  dorm:
    enabled: true
    name_keywords: ["宿舍", "學舍", "舍", "Dorm", "Prince House"]
    relax_night_to_day_high_to: 1.60
    eui_cap_override_by_role:
      building_total: 350.0
      shared_total: 300.0
      unknown: 280.0
      feeder: 260.0
      virtual: 260.0
    relative_eui_ref: 180.0
